<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Catálogo digital da Imprimifácil: comunicação visual e gráfica rápida em Nova Venécia-ES. Peça seu orçamento pelo WhatsApp.">
  <meta name="theme-color" content="#4e488e">
  <title>Imprimifácil — Catálogo Digital</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link id="fontes-tema" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css?v=15">
</head>
<body class="site">
  <a class="visually-hidden-focusable" href="#catalogo">Pular para o catálogo</a>

  <header class="topo" id="topo">
    <div class="container topo-inner">
      <a class="logo" href="#inicio"><img src="/img/logo.svg" alt="Imprimifácil" width="220" height="36"></a>

      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="menu-categorias">
        <span class="menu-toggle-icone" aria-hidden="true"><i></i><i></i><i></i></span>
        <span>Categorias</span>
      </button>

      <nav class="menu-cats" id="menu-categorias" aria-label="Categorias">
        <!-- categorias entram aqui pelo app.js -->
        <a class="menu-whatsapp link-whatsapp" href="#" target="_blank" rel="noopener">
          <i class="bi bi-whatsapp" aria-hidden="true"></i><span>Falar no WhatsApp</span>
        </a>
      </nav>

      <a class="btn-zap link-whatsapp" href="#" target="_blank" rel="noopener">
        <i class="bi bi-whatsapp" aria-hidden="true"></i><span>Falar no WhatsApp</span>
      </a>
    </div>
  </header>

  <main id="inicio">
    <section class="hero">
      <div class="container">
        <div class="row justify-content-center text-center">
          <div class="col-12 col-lg-10 col-xl-9 hero-centro">
            <h1><span id="titulo">Comunicação visual e gráfica rápida,</span> <em id="destaque">do jeito certo.</em></h1>
            <p class="sub" id="slogan"></p>

            <form class="busca" id="form-busca" role="search">
              <i class="bi bi-search" aria-hidden="true"></i>
              <label class="visually-hidden" for="busca">Buscar produto ou serviço</label>
              <input type="search" id="busca" placeholder="Ex.: banner, adesivo, cartão..." autocomplete="off">
              <button type="submit" class="btn-cta">Buscar</button>
            </form>
            <p class="busca-info">
              Ou <a href="#catalogo">veja o catálogo completo <span aria-hidden="true">↓</span></a>
            </p>
          </div>
        </div>
      </div>
    </section>

    <!-- produtos entram aqui pelo app.js -->
    <div id="catalogo" tabindex="-1">
      <p class="vazio" id="carregando">Carregando catálogo...</p>
    </div>
  </main>

  <footer class="rodape">
    <div class="container">
      <div class="rodape-topo">
        <div class="rodape-marca">
          <img src="/img/logo.svg" alt="Imprimifácil" width="220" height="36" style="height:36px; width:auto;">
          <p id="sobre"></p>
        </div>
        <nav class="rodape-col" aria-label="Categorias no rodapé">
          <h4>Categorias</h4>
          <div id="rodape-categorias"></div>
        </nav>
        <div class="rodape-col">
          <h4>Contato</h4>
          <a class="link-whatsapp" href="#" target="_blank" rel="noopener"><i class="bi bi-whatsapp me-1" aria-hidden="true"></i>WhatsApp</a>
          <p id="endereco"></p>
          <p id="horario"></p>
        </div>
      </div>
      <p class="rodape-base">
        © <span id="ano"></span> <span class="nome-empresa">Imprimifácil</span>. Todos os direitos reservados.
      </p>
    </div>
  </footer>

  <a class="flutuante link-whatsapp" href="#" target="_blank" rel="noopener" aria-label="Falar no WhatsApp">
    <i class="bi bi-whatsapp" aria-hidden="true"></i>
  </a>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/tema.js?v=11"></script>
  <script src="/js/app.js?v=12"></script>
</body>
</html>
